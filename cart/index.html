<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
    header{padding:1rem;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
    .badge{background:#22c55e;color:#000;padding:2px 8px;border-radius:999px;font-weight:700;margin-left:8px}
    main{padding:1rem;display:grid;gap:2rem;max-width:900px;margin:auto}
    #products{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
    .product{border:1px solid #ddd;border-radius:12px;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
    .product img{width:100%;height:100px;object-fit:cover;border-radius:8px;background:#f3f3f3}
    button{padding:.5rem .8rem;border-radius:8px;border:1px solid #111;background:#111;color:#fff;cursor:pointer}
    button.secondary{background:#fff;color:#111}
    #cart{border:1px solid #ddd;border-radius:12px;padding:1rem}
    .cart-item{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #eee}
    .qty-controls{display:flex;gap:.3rem;align-items:center}
    .total{font-weight:800;font-size:1.2rem;margin-top:1rem;text-align:right}
  </style>
</head>
<body>
  <header>
    <h2>Duka Yetu</h2>
    <div>🛒 Cart <span id="cart-count" class="badge">0</span></div>
  </header>
  <main>
    <section>
      <h3>Products</h3>
      <div id="products"></div>
    </section>
    <section id="cart">
      <div style="display:flex;justify-content:space-between">
        <h3>Your Cart</h3>
        <div style="display:flex;gap:.5rem">
          <button id="undo-btn" class="secondary">Undo</button>
          <button id="clear-btn" class="secondary">Clear</button>
        </div>
      </div>
      <div id="cart-items"></div>
      <div class="total">Total: Ksh <span id="cart-total">0</span></div>
    </main>
  <script type="module" src="./cart.js"></script>
</body>
</html>
